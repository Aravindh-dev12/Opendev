[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendev"
version = "0.1.0"
description = "Local-first autonomous operator that turns company requests into verified, audited work"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "playwright>=1.45", "pyyaml>=6", "flask>=3", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opendev = "opendev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
