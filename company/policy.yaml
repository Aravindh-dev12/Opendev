company: Northwind Trading Pvt Ltd
allowed_hosts: ["127.0.0.1", "localhost"]
deny_url_patterns: ["/api/", "/admin", "/vendors/new", "/vendors/.*/delete"]
file_read_roots: ["tasks", "company"]
file_write_roots: ["workspace"]
click_guards:
  - name: approval_limit
    click_text: "^Approve invoice$"
    page_regex: "Amount: ([0-9,]+\\.[0-9]{2})"
    max_amount: 2500.00
    reason: "AP-SOP section 4: invoices above 2,500.00 need manager approval. Submit for manager approval instead."
  - name: no_destructive
    click_text: "^(Delete|Remove|Purge).*"
    always_deny: true
    reason: "Destructive actions are never delegated to the operator."
  - name: no_vendor_creation
    click_text: "^(Add vendor|Create vendor)$"
    always_deny: true
    reason: "AP-SOP section 6: unknown vendors go to Procurement, the operator may not create vendors."
fill_guards:
  - name: no_bank_changes
    field_regex: "(?i)bank|iban|account_number|ifsc"
    reason: "Vendor bank details may only be changed by Treasury."
max_steps: 40
max_repeat_action: 3
